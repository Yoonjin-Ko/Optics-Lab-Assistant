<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">원자 크기 척도와 빛 파장 비교</title><desc id="desc">나노미터 단위 로그 축. 원자 크기는 약 0.1 나노미터 척도이며 전자의 고유 지름은 표시하지 않는다.</desc><rect width="1000" height="440" rx="12" fill="#f1f6fb" /><g font-family="Arial, sans-serif" fill="#294b68"><text x="35" y="38" font-size="22">원자 크기 척도와 빛의 파장</text><text x="35" y="66" font-size="14">서로 다른 길이의 비교 · 파장은 광자 자체의 지름이 아닙니다.</text><path d="M80.0 90V308" stroke="#c8d6e3" /><text x="80.0" y="333" text-anchor="middle" font-size="13">0.01 nm</text><path d="M248.0 90V308" stroke="#c8d6e3" /><text x="248.0" y="333" text-anchor="middle" font-size="13">0.1 nm</text><path d="M416.0 90V308" stroke="#c8d6e3" /><text x="416.0" y="333" text-anchor="middle" font-size="13">1 nm</text><path d="M584.0 90V308" stroke="#c8d6e3" /><text x="584.0" y="333" text-anchor="middle" font-size="13">10 nm</text><path d="M752.0 90V308" stroke="#c8d6e3" /><text x="752.0" y="333" text-anchor="middle" font-size="13">100 nm</text><path d="M920.0 90V308" stroke="#c8d6e3" /><text x="920.0" y="333" text-anchor="middle" font-size="13">1000 nm</text><path d="M80 110H248.0" stroke="#4a9891" stroke-width="6" /><circle cx="248.0" cy="110" r="6" fill="#4a9891" /><text x="260.0" y="115" font-size="14">원자 크기 척도 · 0.1 nm</text><path d="M80 149H279.5319021122309" stroke="#557ba5" stroke-width="6" /><circle cx="279.5319021122309" cy="149" r="6" fill="#557ba5" /><text x="291.5319021122309" y="154" font-size="14">Cu Kα₁ X선 · 0.15406 nm</text><path d="M80 188H605.896073107161" stroke="#8e73ad" stroke-width="6" /><circle cx="605.896073107161" cy="188" r="6" fill="#8e73ad" /><text x="617.896073107161" y="193" font-size="14">EUV · 13.5 nm</text><path d="M80 227H799.973627913306" stroke="#b7874a" stroke-width="6" /><circle cx="799.973627913306" cy="227" r="6" fill="#b7874a" /><text x="787.973627913306" y="232" font-size="14" text-anchor="end">ArF DUV · 193 nm</text><path d="M80 266H876.380931835033" stroke="#589564" stroke-width="6" /><circle cx="876.380931835033" cy="266" r="6" fill="#589564" /><text x="864.380931835033" y="271" font-size="14" text-anchor="end">가시광 예 · 550 nm</text><text x="35" y="363" font-size="13">로그 축: 같은 가로 간격은 길이의 10배 차이에 해당합니다.</text><rect x="30" y="380" width="940" height="40" rx="5" fill="#e1ebf4" /><text x="45" y="405" font-size="14">전자: 고유 지름이 측정된 작은 공이 아닙니다. 전자 구름의 퍼짐과 전자 자체 크기는 다릅니다.</text></g></svg>