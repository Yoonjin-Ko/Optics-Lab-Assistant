<path d="M632.975081449114 350v9" class="rule"/><text x="632.975081449114" y="376" text-anchor="middle" class="small">380 nm</text>
<path d="M744.2709035213992 350v9" class="rule"/><text x="744.2709035213992" y="376" text-anchor="middle" class="small">780 nm</text>
<path d="M890.0 350v9" class="rule"/><text x="890.0" y="376" text-anchor="middle" class="small">2,000 nm</text>
<circle cx="116.44602215846636" cy="299" r="4" fill="#51478c"/><path d="M116.44602215846636 300V392" stroke="#51478c" stroke-dasharray="3 4"/><rect x="42.44602215846636" y="394" width="148" height="46" rx="4" fill="#f1f5fa" stroke="#bed0de"/><text x="116.44602215846636" y="411" text-anchor="middle" class="small">EUV · 13.5 nm</text><text x="116.44602215846636" y="429" text-anchor="middle" class="small">91.840 eV / photon</text>
<circle cx="528.1239685587796" cy="299" r="4" fill="#6956a0"/><path d="M528.1239685587796 300V392" stroke="#6956a0" stroke-dasharray="3 4"/><rect x="454.12396855877955" y="394" width="148" height="46" rx="4" fill="#f1f5fa" stroke="#bed0de"/><text x="528.1239685587796" y="411" text-anchor="middle" class="small">DUV · 193 nm</text><text x="528.1239685587796" y="429" text-anchor="middle" class="small">6.424 eV / photon</text>
<circle cx="566.9298011899864" cy="299" r="4" fill="#6956a0"/><path d="M566.9298011899864 300V444" stroke="#6956a0" stroke-dasharray="3 4"/><rect x="492.9298011899864" y="446" width="148" height="46" rx="4" fill="#f1f5fa" stroke="#bed0de"/><text x="566.9298011899864" y="463" text-anchor="middle" class="small">DUV · 248 nm</text><text x="566.9298011899864" y="481" text-anchor="middle" class="small">4.999 eV / photon</text>
<circle cx="685.049582642906" cy="299" r="4" fill="#2c8656"/><path d="M685.049582642906 300V392" stroke="#2c8656" stroke-dasharray="3 4"/><rect x="611.049582642906" y="394" width="148" height="46" rx="4" fill="#f1f5fa" stroke="#bed0de"/><text x="685.049582642906" y="411" text-anchor="middle" class="small">녹색 · 532 nm</text><text x="685.049582642906" y="429" text-anchor="middle" class="small">2.331 eV / photon</text>
<rect x="50" y="519" width="860" height="68" rx="4" fill="#eaf2f9"/>
<text x="480" y="548" text-anchor="middle" class="label">E = hν = hc / λ₀ ≈ 1239.842 / λ₀[nm] eV</text>
<text x="480" y="572" text-anchor="middle" class="small">파장 절반 → 광자 에너지 두 배  |  광자 에너지는 빔의 출력(W)·눈에 보이는 밝기와 다릅니다.</text>
<text x="50" y="616" class="small">• 가시광은 약 380–780 nm로 표시했습니다. 영역 경계는 분야와 정의에 따라 달라집니다.</text>
<text x="50" y="637" class="small">• EUV·DUV는 보이지 않습니다. 자외선·적외선의 색은 구분용이며 실제 보이는 색이 아닙니다.</text>
<text x="50" y="658" class="small">• EUV 13.5 nm, DUV 193·248 nm는 대표 노광 파장입니다. 영역 전체를 뜻하는 경계값이 아닙니다.</text>
</svg>