<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
<title id="title">빛의 종류와 파장별 광자 에너지 — EUV·DUV 포함</title><desc id="desc">전자기파 종류의 개략도와 10~2000 나노미터 로그 축에서 표시한 EUV 13.5, DUV 193과 248, 가시광과 적외선. 짧은 파장일수록 광자 에너지가 크다.</desc>
<defs><linearGradient id="visible"><stop stop-color="#773bb2"/><stop offset=".2" stop-color="#3659ce"/><stop offset=".4" stop-color="#279ad2"/><stop offset=".55" stop-color="#42ad69"/><stop offset=".7" stop-color="#edcf47"/><stop offset=".85" stop-color="#ec9146"/><stop offset="1" stop-color="#ca5057"/></linearGradient><linearGradient id="uv"><stop stop-color="#51478c"/><stop offset="1" stop-color="#ba9bdb"/></linearGradient><linearGradient id="ir"><stop stop-color="#c76a65"/><stop offset="1" stop-color="#91495b"/></linearGradient></defs>
<style>text{font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#284962}.title{font-size:26px;font-weight:bold}.sub{font-size:13px;fill:#698397}.small{font-size:12px}.label{font-size:15px;font-weight:bold}.white{fill:white}.rule{stroke:#b9cedc;stroke-width:1}</style>
<rect width="960" height="700" rx="8" fill="#f4f8fb"/><rect x="20" y="20" width="920" height="660" rx="6" fill="white" stroke="#b5cedf"/>
<text x="50" y="62" class="title">LIGHT SPECTRUM</text><text x="50" y="88" class="sub">빛의 종류 · 진공 파장 λ₀ · 광자 한 개의 에너지 E</text>
<text x="50" y="124" class="label">01 / 전자기 스펙트럼 전체 보기</text><text x="890" y="124" text-anchor="end" class="small">영역 폭은 실제 비율이 아닌 개략도</text>

<rect x="50.0" y="140" width="122.85714285714286" height="46" fill="#625a8f"/><text x="111.42857142857143" y="169" text-anchor="middle" class="label white">감마선</text>
<rect x="172.85714285714286" y="140" width="122.85714285714286" height="46" fill="#617ca4"/><text x="234.28571428571428" y="169" text-anchor="middle" class="label white">X선</text>
<rect x="295.7142857142857" y="140" width="122.85714285714286" height="46" fill="#9271bd"/><text x="357.14285714285717" y="169" text-anchor="middle" class="label white">자외선</text>
<rect x="418.57142857142856" y="140" width="122.85714285714286" height="46" fill="url(#visible)"/><text x="480.0" y="169" text-anchor="middle" class="label white">가시광</text>
<rect x="541.4285714285714" y="140" width="122.85714285714286" height="46" fill="#c57978"/><text x="602.8571428571429" y="169" text-anchor="middle" class="label white">적외선</text>
<rect x="664.2857142857143" y="140" width="122.85714285714286" height="46" fill="#b1977a"/><text x="725.7142857142858" y="169" text-anchor="middle" class="label white">마이크로파</text>
<rect x="787.1428571428571" y="140" width="122.85714285714286" height="46" fill="#829a9a"/><text x="848.5714285714286" y="169" text-anchor="middle" class="label white">전파</text>
<path d="M70 209H890M70 209l10 -5M70 209l10 5" stroke="#417a9f" fill="none"/><text x="480" y="232" text-anchor="middle" class="small">← 짧은 파장 · 높은 진동수 · 높은 광자 에너지</text>
<text x="50" y="275" class="label">02 / 노광 파장과 가시광 확대</text><text x="890" y="275" text-anchor="end" class="small">파장 로그 축 · 10–2,000 nm</text>
<rect x="70.0" y="300" width="562.975081449114" height="50" fill="url(#uv)"/><text x="351.487540724557" y="330" text-anchor="middle" class="small white">자외선 영역</text>
<rect x="632.975081449114" y="300" width="111.2958220722852" height="50" fill="url(#visible)"/><text x="688.6229924852566" y="330" text-anchor="middle" class="small white">가시광</text>
<rect x="744.2709035213992" y="300" width="145.7290964786008" height="50" fill="url(#ir)"/><text x="817.1354517606997" y="330" text-anchor="middle" class="small white">적외선</text>
